/* Smart link: the clip plays on the page, then every platform as one equal button, Spotify first.
   No artwork: on a phone it pushed the buttons below the fold. */
.go{padding-block:var(--s4) var(--s6);display:grid;gap:var(--s4)}
.video{position:relative;width:100%;aspect-ratio:16/9;background:var(--surface);border:1px solid var(--line)}

<body>

<header>

<main>
  <section class="go" aria-labelledby="h-go">

      <iframe id="clip" src="https://www.youtube-nocookie.com/embed/tvCrLse6IT0?enablejsapi=1&amp;playsinline=1&amp;rel=0&amp;origin=https%3A%2F%2Fwww.the-clive.com" title="The Clive, A02 // LOST IN TIME, official music video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

<script>
// Pass the ad parameters (fbclid, utm_*) to the links. Nothing is stored in the browser.
// The server counts: the page shown ("view") and the clip started on the page ("play").
(function () {
  var q = location.search;
  if (q) document.querySelectorAll('[data-go]').forEach(function (a) { a.href = a.getAttribute('href') + q; });
  function ping(action) {
    try { fetch('/api/go/a02/' + action + q, { method: 'POST', keepalive: true }).catch(function () {}); } catch (e) {}
  }
  ping('view');

  var yt = document.getElementById('clip'), YT = 'https://www.youtube-nocookie.com', played = false;
  function play() { if (!played) { played = true; ping('play'); } }
  // Ask the YouTube player to report its state (1 = playing, 3 = buffering).
  function listen() {
    try { yt.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'clip', channel: 'widget' }), YT); } catch (e) {}
  }
  yt.addEventListener('load', listen);
  setTimeout(listen, 1500);
  window.addEventListener('message', function (e) {
    if (e.origin !== YT || typeof e.data !== 'string') return;
    var d; try { d = JSON.parse(e.data); } catch (err) { return; }
    var s = d.event === 'onStateChange' ? d.info : (d.info && d.info.playerState);
    if (s === 1 || s === 3) play();
  });
  // Fallback: a tap inside the player moves the focus to it.
  window.addEventListener('blur', function () {
    setTimeout(function () { if (document.activeElement === yt) play(); }, 0);
  });
})();
</script>
